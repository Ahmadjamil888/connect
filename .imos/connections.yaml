connections:
- name: anthropic
  adapter_type: model
  provider: anthropic
  auto_connect: false
- name: openai
  adapter_type: model
  provider: openai
  auto_connect: false
- name: browser_live
  adapter_type: webapp
  provider: browser
  auto_connect: false
  HEADLESS: true
settings:
  default_model: auto
  parallel_execution: true
  max_concurrent_tasks: 10
  result_synthesis_model: anthropic
  log_level: info
  dashboard_port: 8765
  enable_payments: false
  enable_os_control: true
