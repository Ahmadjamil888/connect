<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Html Landing Page</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f0e8;
      --panel: #fffaf2;
      --text: #1f1a14;
      --muted: #6c6258;
      --accent: #b85c38;
      --accent-dark: #8e4325;
      --border: #e3d6c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      background: linear-gradient(180deg, var(--bg), #efe4d4);
      color: var(--text);
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 20px 60px rgba(31, 26, 20, 0.08);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(184, 92, 56, 0.12);
      color: var(--accent-dark);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 0.95;
    }
    p {
      max-width: 52ch;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      border: 1px solid var(--accent);
      color: white;
      background: var(--accent);
    }
    .button.secondary {
      background: transparent;
      color: var(--accent-dark);
      border-color: var(--border);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <span class="eyebrow">Launch Ready</span>
      <h1>Html Landing Page</h1>
      <p>A clean single-file landing page scaffold generated by IMOS. Replace this copy with your product pitch, proof points, and call to action.</p>
      <div class="actions">
        <a class="button" href="#start">Get Started</a>
        <a class="button secondary" href="#learn">Learn More</a>
      </div>
    </section>
  </main>
</body>
</html>
